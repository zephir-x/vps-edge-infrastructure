# Hide Nginx version from HTTP response headers
server_tokens off;

# 1. GYMCORE (Generation 1: Split L7 routing to API & Frontend)
server {
    listen 80;
    server_name gymcore.com.pl www.gymcore.com.pl;

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_api http://gymcore_api:8080;

        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_gymcore http://gymcore_frontend:80;

        proxy_pass $upstream_gymcore;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 2. GAMENEST (Generation 1: Containerized Nginx + PHP-FPM upstream)
server {
    listen 80;
    server_name gamenest.com.pl www.gamenest.com.pl;
    client_max_body_size 100M;

    location ~ /\. {
        deny all;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_gamenest http://game-store-nginx-1:80;

        proxy_pass $upstream_gamenest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 3. PROJECTHUB (Generation 2: Isolated internal backend + SignalR WebSockets)
server {
    listen 80;
    server_name myprojecthub.com.pl www.myprojecthub.com.pl;
    client_max_body_size 25M;

    location ~ /\. {
        deny all;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_ph_web http://projecthub_web:80;

        proxy_pass $upstream_ph_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR real-time WebSocket endpoint
    location /kanbanHub {
        resolver 127.0.0.11 valid=30s;
        set $upstream_ph_hub http://projecthub_web:80;

        proxy_pass $upstream_ph_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 4. CRACOW360 (Generation 2: IDN Punycode routing + strict backend isolation)
server {
    listen 80;
    server_name xn--krakw360-y3a.pl www.xn--krakw360-y3a.pl;
    client_max_body_size 10M;

    location ~ /\. {
